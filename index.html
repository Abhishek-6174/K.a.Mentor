/* ============ LUCIDE ICON WRAPPER ============ */
function Icon({ name, size = 16, className = "", strokeWidth = 2 }) {
  const lib = window.lucide || {};
  const node = lib[name];
  if (!node || !Array.isArray(node)) {
    return React.createElement('svg', {
      width: size, height: size, viewBox: '0 0 24 24',
      fill: 'none', stroke: 'currentColor', strokeWidth,
      strokeLinecap: 'round', strokeLinejoin: 'round', className
    });
  }
  const children = node.map((child, i) => {
    if (!Array.isArray(child)) return null;
    const [tag, attrs] = child;
    return React.createElement(tag, { key: i, ...(attrs || {}) });
  });
  return React.createElement('svg', {
    xmlns: 'http://www.w3.org/2000/svg',
    width: size, height: size, viewBox: '0 0 24 24',
    fill: 'none', stroke: 'currentColor', strokeWidth,
    strokeLinecap: 'round', strokeLinejoin: 'round', className
  }, children);
}

const getEnvVar = (key) => {
  try { const v = localStorage.getItem(key); if (v) return v; } catch(e) {}
  return '';

/* ============ INDEXED DB ============ */
const initLocalDB = () => new Promise((resolve, reject) => {
  const request = indexedDB.open('KAMentorLocalBrain', 3);
  request.onupgradeneeded = (e) => {
    const database = e.target.result;
    if (!database.objectStoreNames.contains('memories')) database.createObjectStore('memories', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('chatSessions')) database.createObjectStore('chatSessions', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('settings')) database.createObjectStore('settings', { keyPath: 'key' });
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
const saveSetting = async (key, value) => {
  try { const d = await initLocalDB(); d.transaction(['settings'], 'readwrite').objectStore('settings').put({ key, value }); } catch(e){}
};
const getSetting = async (key) => {
  try {
    const d = await initLocalDB();
    return new Promise((res) => {
      const r = d.transaction(['settings'],'readonly').objectStore('settings').get(key);
      r.onsuccess = () => res(r.result?.value || "");
    });
  } catch(e) { return ""; }
};
const saveLocalMemory = async (text) => {
  try { const d = await initLocalDB(); d.transaction(['memories'],'readwrite').objectStore('memories').put({ id: Date.now().toString(), text, timestamp: Date.now() }); } catch(e){}
};
const getLocalMemories = async () => {
  try {
    const d = await initLocalDB();
    return new Promise((res) => {
      const r = d.transaction(['memories'],'readonly').objectStore('memories').getAll();
      r.onsuccess = () => res(r.result || []);
    });
  } catch(e) { return []; }
};
const saveChatSession = async (s) => {
  try { const d = await initLocalDB(); d.transaction(['chatSessions'],'readwrite').objectStore('chatSessions').put(s); } catch(e){}
};
const getChatSessions = async () => {
  try {
    const d = await initLocalDB();
    return new Promise((res) => {
      const r = d.transaction(['chatSessions'],'readonly').objectStore('chatSessions').getAll();
      r.onsuccess = () => res(r.result?.sort((a,b)=>b.updatedAt-a.updatedAt) || []);
    });
  } catch(e) { return []; }
};
const deleteChatSession = async (id) => {
  try { const d = await initLocalDB(); d.transaction(['chatSessions'],'readwrite').objectStore('chatSessions').delete(id); } catch(e){}
};

/* ============ ROUTER ============ */
const AI_PROVIDERS = { GEMINI:'gemini', GROQ:'groq', OPENROUTER:'openrouter', CLOUDFLARE:'cloudflare' };

const ROUTER_CONFIG = {
  mentor: {
    sequence: [AI_PROVIDERS.GEMINI, AI_PROVIDERS.GROQ, AI_PROVIDERS.OPENROUTER],
    models: {
      [AI_PROVIDERS.GEMINI]: 'gemini-2.5-flash',
      [AI_PROVIDERS.GROQ]: 'llama3-8b-8192',
      [AI_PROVIDERS.OPENROUTER]: 'google/gemini-2.5-flash'
    },
    systemPrompt: "Ek calm, highly intelligent, emotionally controlled strategist ka mindset adopt karo. Jawab concise, precise, aur seedha ho. Reply naturally in the user's language (Hindi or English)."
  },
  devAgent: {
    sequence: [AI_PROVIDERS.GEMINI, AI_PROVIDERS.GROQ, AI_PROVIDERS.OPENROUTER],
    models: {
      [AI_PROVIDERS.GEMINI]: 'gemini-2.5-flash',
      [AI_PROVIDERS.GROQ]: 'llama3-70b-8192',
      [AI_PROVIDERS.OPENROUTER]: 'anthropic/claude-3.5-haiku'
    },
    systemPrompt: "You are K.A Dev Agent, an elite senior software engineer and architect."
  }
};

const fetchWithTimeout = async (resource, options = {}) => {
  const { timeout = 15000 } = options;
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(resource, { ...options, signal: controller.signal });
    clearTimeout(id); return response;
  } catch (error) {
    clearTimeout(id);
    if (error.name === 'AbortError') throw new Error('REQUEST_TIMEOUT');
    throw error;
  }
};

const adapters = {
  [AI_PROVIDERS.GEMINI]: async (messages, systemPrompt, model) => {
    const formattedMessages = messages.map(msg => ({
      role: msg.sender === 'user' ? 'user' : 'model',
      parts: [{ text: msg.text }]
    }));
    const apiKey = getEnvVar('VITE_GEMINI_API_KEY');
    if (!apiKey) throw new Error("API_KEY_MISSING");
    const response = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt }] }, contents: formattedMessages })
    });
    if (!response.ok) throw new Error(response.status === 429 ? "RATE_LIMIT" : "NETWORK_FAILURE");
    const data = await response.json();
    return data.candidates[0].content.parts[0].text;
  },
  [AI_PROVIDERS.GROQ]: async (messages, systemPrompt, model) => {
    const apiKey = getEnvVar('VITE_GROQ_API_KEY');
    if (!apiKey) throw new Error("API_KEY_MISSING");
    const formattedMessages = [
      { role: "system", content: systemPrompt },
      ...messages.map(msg => ({ role: msg.sender === 'user' ? 'user' : 'assistant', content: msg.text }))
    ];
    const response = await fetchWithTimeout(`https://api.groq.com/openai/v1/chat/completions`, {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
      body: JSON.stringify({ model, messages: formattedMessages })
    });
    if (!response.ok) throw new Error(response.status === 429 ? "RATE_LIMIT" : "NETWORK_FAILURE");
    const data = await response.json();
    return data.choices[0].message.content;
  },
  [AI_PROVIDERS.OPENROUTER]: async (messages, systemPrompt, model) => {
    const apiKey = getEnvVar('VITE_OPENROUTER_API_KEY');
    if (!apiKey) throw new Error("API_KEY_MISSING");
    const formattedMessages = [
      { role: "system", content: systemPrompt },
      ...messages.map(msg => ({ role: msg.sender === 'user' ? 'user' : 'assistant', content: msg.text }))
    ];
    const response = await fetchWithTimeout(`https://openrouter.ai/api/v1/chat/completions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}`, "X-Title": "K.A Mentor" },
      body: JSON.stringify({ model, messages: formattedMessages })
    });
    if (!response.ok) throw new Error(response.status === 429 ? "RATE_LIMIT" : "NETWORK_FAILURE");
    const data = await response.json();
    return data.choices[0].message.content;
  },
  [AI_PROVIDERS.CLOUDFLARE]: async () => { throw new Error("PROVIDER_NOT_IMPLEMENTED"); }
};

const processOfflineQuery = async (text) => {
  const lowerText = text.toLowerCase();
  if (lowerText.includes("memory") || lowerText.includes("remember") || lowerText.includes("yaad")) {
    const memories = await getLocalMemories();
    if (memories.length === 0) return "[LOCAL CORE]: Offline memory bank is empty.";
    return `[LOCAL CORE]: Operating offline. Local memories:\n\n${memories.map(m => `• ${m.text}`).join('\n')}`;
  }
  if (lowerText.match(/^(hi|hello|hey|kaise ho|namaste|who are you|tum kaun ho)/)) {
    return "[LOCAL CORE]: Hello! Main abhi offline hoon aur local fallback engine par chal raha hoon. Basic baat-cheet, math, aur tech concepts handle kar sakta hoon.";
  }
  try {
    const mathMatch = text.match(/[\d\.\s\+\-\*\/\(\)]+/);
    if (mathMatch && mathMatch[0].trim().length > 2 && /[+\-*/]/.test(mathMatch[0])) {
      const expression = mathMatch[0].trim();
      const result = new Function(`return ${expression}`)();
      return `[LOCAL CORE]: Offline Calculation Result:\n${expression} = ${result}`;
    }
  } catch(e) {}
  if (lowerText.includes("react")) return "[LOCAL CORE]: React ek JavaScript library hai UI banane ke liye.";
  if (lowerText.includes("error") || lowerText.includes("bug")) return "[LOCAL CORE]: Bug strategy:\n1. Console errors padho.\n2. Variables undefined check karo.\n3. Logic trace karo.";
  return `[LOCAL CORE]: Received: "${text}".\n\nMain offline hoon. Basic math, greetings, memory recall, aur standard tech solve kar sakta hoon.`;
};

const routeAIRequest = async (agent, messages, userInstructions = "") => {
  if (!navigator.onLine) return await processOfflineQuery(messages[messages.length - 1].text);
  const config = ROUTER_CONFIG[agent] || ROUTER_CONFIG.mentor;
  let finalSystemPrompt = config.systemPrompt;
  if (userInstructions && userInstructions.trim() !== "") {
    finalSystemPrompt += `\n\nUSER'S PERSONAL INSTRUCTIONS (Adhere strictly):\n${userInstructions}`;
  }
  const recentMessages = messages.slice(-50);
  let lastError = null;
  for (const provider of config.sequence) {
    try {
      const model = config.models[provider];
      if (!model) continue;
      return await adapters[provider](recentMessages, finalSystemPrompt, model);
    } catch (error) {
      lastError = error;
      if (['RATE_LIMIT','NETWORK_FAILURE','REQUEST_TIMEOUT','API_KEY_MISSING'].includes(error.message)) continue;
      throw error;
    }
  }
  if (lastError && lastError.message === 'API_KEY_MISSING') throw new Error("ALL_PROVIDERS_UNCONFIGURED");
  throw lastError || new Error("ALL_PROVIDERS_FAILED");
};

/* ============ ERROR BOUNDARY ============ */
class ErrorBoundary extends Component {
  constructor(props) { super(props); this.state = { hasError: false, err: null }; }
  static getDerivedStateFromError(err) { return { hasError: true, err }; }
  componentDidCatch(error, info) { console.error("Crash:", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="fixed inset-0 bg-black text-red-500 flex flex-col items-center justify-center p-6 z-50">
          <Activity size={48} className="mb-4 animate-pulse" />
          <h1 className="text-xl font-bold mb-2">System Crash</h1>
          <pre className="text-xs text-red-400 max-w-full overflow-auto p-2 bg-red-950/20 rounded">
            {String(this.state.err?.message || this.state.err)}
          </pre>
          <button onClick={() => window.location.reload()} className="px-6 py-2 bg-red-900/30 border border-red-500 rounded-lg text-white mt-4">
            Reboot
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============ MAIN APP ============ */
function KASourceControlApp() {
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 768);
  const [showAdminPanel, setShowAdminPanel] = useState(false);
  const [showProfilePanel, setShowProfilePanel] = useState(false);
  const [isAdminAuth, setIsAdminAuth] = useState(false);
  const [adminPin, setAdminPin] = useState("");
  const [customInstructions, setCustomInstructions] = useState("");
  const [isSavingSettings, setIsSavingSettings] = useState(false);
  const [diagnostics, setDiagnostics] = useState({});
  const [isTesting, setIsTesting] = useState(false);
  const [currentAgent, setCurrentAgent] = useState("mentor");
  const [sessions, setSessions] = useState([]);
  const [activeSessionId, setActiveSessionId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => {
    const handleOnline = () => setIsOnline(true);
    const handleOffline = () => setIsOnline(false);
    const handleResize = () => { if (window.innerWidth > 768) setIsSidebarOpen(true); };
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    window.addEventListener('resize', handleResize);
    loadSessions();
    getSetting('customInstructions').then(val => setCustomInstructions(val));
    runDiagnostics();
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
      window.removeEventListener('resize', handleResize);
    };
  }, []);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isTyping]);

  const runDiagnostics = () => {
    setDiagnostics(prev => ({
      ...prev,
      [AI_PROVIDERS.GEMINI]: prev[AI_PROVIDERS.GEMINI] === 'Connected (Verified)' ? 'Connected (Verified)' : (getEnvVar('VITE_GEMINI_API_KEY') ? 'Requires Verification' : 'Missing Key'),
      [AI_PROVIDERS.GROQ]: prev[AI_PROVIDERS.GROQ] === 'Connected (Verified)' ? 'Connected (Verified)' : (getEnvVar('VITE_GROQ_API_KEY') ? 'Requires Verification' : 'Missing Key'),
      [AI_PROVIDERS.OPENROUTER]: prev[AI_PROVIDERS.OPENROUTER] === 'Connected (Verified)' ? 'Connected (Verified)' : (getEnvVar('VITE_OPENROUTER_API_KEY') ? 'Requires Verification' : 'Missing Key'),
      firebase: 'Missing Config'
    }));
  };

  const handleVerifyProvider = async (provider) => {
    setIsTesting(provider);
    try {
      const model = ROUTER_CONFIG.mentor.models[provider];
      if (!model) throw new Error("No model");
      const testMsg = [{ sender: 'user', text: 'Respond with exactly one word: OK', timestamp: Date.now() }];
      await adapters[provider](testMsg, "System diagnostic.", model);
      setDiagnostics(prev => ({ ...prev, [provider]: 'Connected (Verified)' }));
    } catch (error) {
      setDiagnostics(prev => ({ ...prev, [provider]: 'Failed: ' + error.message }));
    } finally { setIsTesting(false); }
  };

  const loadSessions = async () => {
    const loaded = await getChatSessions();
    setSessions(loaded);
    if (loaded.length > 0) {
      const latest = loaded[0];
      setActiveSessionId(latest.id); setMessages(latest.messages); setCurrentAgent(latest.agent || 'mentor');
    } else { createNewSession('mentor'); }
  };

  const createNewSession = async (agentMode = currentAgent) => {
    const newSession = {
      id: Date.now().toString(),
      title: `New ${agentMode === 'mentor' ? 'Mentorship' : 'Dev'} Session`,
      agent: agentMode,
      messages: [{ sender: 'ai', text: `System Online. I am K.A ${agentMode === 'mentor' ? 'Mentor' : 'Dev Agent'}. How can I assist you today?`, timestamp: Date.now() }],
      updatedAt: Date.now()
    };
    setCurrentAgent(agentMode); setActiveSessionId(newSession.id); setMessages(newSession.messages);
    setSessions(prev => [newSession, ...prev]);
    await saveChatSession(newSession);
    if (window.innerWidth < 768) setIsSidebarOpen(false);
  };

  const switchSession = (sessionId) => {
    const session = sessions.find(s => s.id === sessionId);
    if (session) {
      setActiveSessionId(session.id); setMessages(session.messages);
      setCurrentAgent(session.agent || 'mentor');
      if (window.innerWidth < 768) setIsSidebarOpen(false);
    }
  };

  const handleDeleteSession = async (e, id) => {
    e.stopPropagation();
    await deleteChatSession(id);
    const updated = sessions.filter(s => s.id !== id);
    setSessions(updated);
    if (activeSessionId === id) {
      if (updated.length > 0) switchSession(updated[0].id);
      else createNewSession(currentAgent);
    }
  };

  const handleSendMessage = async (e) => {
    e.preventDefault();
    const text = chatInput.trim();
    if (!text || isTyping) return;

    const newUserMsg = { sender: 'user', text, timestamp: Date.now() };
    const updatedMessages = [...messages, newUserMsg];
    setMessages(updatedMessages); setChatInput(''); setIsTyping(true);

    const updatedSession = {
      id: activeSessionId,
      title: updatedMessages.length === 2 ? text.substring(0, 30) + '...' : (sessions.find(s=>s.id===activeSessionId)?.title || 'Chat'),
      agent: currentAgent, messages: updatedMessages, updatedAt: Date.now()
    };
    setSessions(sessions.map(s => s.id === activeSessionId ? updatedSession : s));
    await saveChatSession(updatedSession);

    if (text.toLowerCase().startsWith("remember:")) {
      const memoryToSave = text.replace(/remember:/i, '').trim();
      await saveLocalMemory(memoryToSave);
      const memMsg = { sender: 'system', text: `[MEMORY SAVED]: ${memoryToSave}`, timestamp: Date.now() };
      const finalMsg = [...updatedMessages, memMsg];
      setMessages(finalMsg); updatedSession.messages = finalMsg;
      await saveChatSession(updatedSession); setIsTyping(false); return;
    }

    try {
      const responseText = await routeAIRequest(currentAgent, updatedMessages, customInstructions);
      const aiMsg = { sender: 'ai', text: responseText, timestamp: Date.now() };
      const finalMessages = [...updatedMessages, aiMsg];
      setMessages(finalMessages); updatedSession.messages = finalMessages;
      await saveChatSession(updatedSession);
    } catch (error) {
      let errorMessage = "SYSTEM NOTICE: AI Router encountered a fatal error.";
      if (error.message === "ALL_PROVIDERS_UNCONFIGURED" || error.message === "API_KEY_MISSING") {
        errorMessage = `⚠️ Gemini API Key missing hai.\n\nSetup:\n1. Top-right shield icon 🛡️ kholo\n2. PIN: 0001@\n3. "API Keys" section mein key paste karo\n4. Reload karo\n\nFree key: aistudio.google.com/app/apikey`;
      }
      else if (error.message === "RATE_LIMIT") errorMessage = "SYSTEM NOTICE: All providers hit Rate Limits.";
      else if (error.message === "NETWORK_FAILURE") errorMessage = "SYSTEM NOTICE: Network failure. Check internet.";
      else if (error.message === "REQUEST_TIMEOUT") errorMessage = "SYSTEM NOTICE: Request timed out.";
      const errMsg = { sender: 'system', text: errorMessage, timestamp: Date.now(), isError: true };
      const finalMessages = [...updatedMessages, errMsg];
      setMessages(finalMessages); updatedSession.messages = finalMessages;
      await saveChatSession(updatedSession);
    } finally { setIsTyping(false); }
  };

  const handleAdminLogin = (e) => {
    e.preventDefault();
    if (adminPin === "0001@") { setIsAdminAuth(true); runDiagnostics(); }
    else alert("Invalid PIN");
  };

  return (
    <div className="flex h-screen bg-[#050505] text-white font-sans overflow-hidden relative">
      {isSidebarOpen && (
        <div className="md:hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40" onClick={() => setIsSidebarOpen(false)} />
      )}

      <div className={`fixed md:relative z-50 h-full flex flex-col bg-[#0a0a0a] border-r border-white/5 transition-transform duration-300 ${isSidebarOpen ? 'w-72 translate-x-0' : 'w-72 -translate-x-full md:w-0 md:border-none'}`}>
        <div className="p-4 border-b border-white/5 flex justify-between items-center bg-black">
          <div className="flex items-center gap-2 text-cyan-500 font-bold tracking-widest text-sm">
            <History size={16} /> HISTORY
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => createNewSession(currentAgent)} className="text-gray-400 hover:text-cyan-400 p-1"><Plus size={18} /></button>
            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-gray-500 hover:text-white p-1"><X size={20} /></button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
          {sessions.map(session => (
            <div key={session.id} onClick={() => switchSession(session.id)}
              className={`group w-full text-left p-3 rounded-lg flex justify-between items-center cursor-pointer ${activeSessionId === session.id ? 'bg-white/10 border-l-2 border-cyan-500' : 'hover:bg-white/5'}`}>
              <div className="flex items-center gap-3 overflow-hidden">
                {session.agent === 'devAgent' ? <Terminal size={14} className="text-purple-500 shrink-0"/> : <MessageSquare size={14} className="text-cyan-500 shrink-0"/>}
                <span className="text-sm truncate text-gray-300 font-medium">{session.title}</span>
              </div>
              <button onClick={(e) => handleDeleteSession(e, session.id)} className="text-gray-500 hover:text-red-400 p-1">
                <Trash2 size={14} />
              </button>
            </div>
          ))}
          {sessions.length === 0 && <div className="text-center text-gray-600 text-xs mt-10">No chat history.</div>}
        </div>
        <div className="p-4 border-t border-white/5 bg-black/40">
          <button onClick={() => { setIsSidebarOpen(false); setShowProfilePanel(true); }}
            className="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-white/5 text-gray-300">
            <div className="w-8 h-8 rounded-full bg-cyan-900/30 flex items-center justify-center border border-cyan-500/30">
              <User size={16} className="text-cyan-400" />
            </div>
            <div className="text-left flex-1">
              <div className="text-sm font-semibold">User Profile</div>
              <div className="text-xs text-gray-500">Settings & Memory</div>
            </div>
            <Settings size={14} className="text-gray-600" />
          </button>
        </div>
      </div>

      <div className="flex-1 flex flex-col h-full relative min-w-0 bg-gradient-to-b from-cyan-950/20 via-[#050505] to-black">
        <header className="h-14 border-b border-white/5 bg-black/40 backdrop-blur-md flex items-center justify-between px-4 z-30">
          <div className="flex items-center gap-3">
            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="text-gray-400 hover:text-white p-1"><Menu size={20} /></button>
            <div className="flex items-center gap-2">
              {currentAgent === 'devAgent' ? <Terminal size={18} className="text-purple-500"/> : <BrainCircuit size={18} className="text-cyan-500" />}
              <span className="font-bold tracking-wide text-sm text-gray-100 uppercase">
                K.A {currentAgent === 'devAgent' ? 'Dev Agent' : 'Mentor'}
              </span>
            </div>
            {!isOnline && (
              <span className="flex items-center gap-1 text-[10px] text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 ml-2">
                <CloudOff size={10}/> OFFLINE
              </span>
            )}
          </div>
          <button onClick={() => setShowAdminPanel(true)}
            className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10">
            <Shield size={14} className={isAdminAuth ? "text-green-400" : "text-gray-400"} />
            <span className="text-xs font-semibold text-gray-400 hidden sm:block">Admin</span>
          </button>
        </header>

        <div className="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6 max-w-4xl mx-auto w-full">
          {messages.map((msg, i) => (
            <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
              <div className={`max-w-[85%] md:max-w-[75%] rounded-2xl p-4 text-sm whitespace-pre-wrap leading-relaxed ${
                msg.sender === 'user' ? 'bg-cyan-800/20 text-cyan-50 border border-cyan-500/30 rounded-tr-sm'
                  : msg.isError ? 'bg-red-900/20 text-red-400 border border-red-500/20 rounded-tl-sm'
                  : msg.sender === 'system' ? 'bg-amber-900/10 text-amber-300 border border-amber-500/20 rounded-tl-sm text-xs font-mono'
                  : 'bg-[#111] text-gray-200 border border-white/5 rounded-tl-sm'
              }`}>{msg.text}</div>
            </div>
          ))}
          {isTyping && (
            <div className="flex justify-start">
              <div className="rounded-2xl p-4 bg-[#111] border border-white/5 rounded-tl-sm flex items-center gap-2">
                <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse"></div>
                <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse" style={{ animationDelay: '0.2s' }}></div>
                <div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse" style={{ animationDelay: '0.4s' }}></div>
              </div>
            </div>
          )}
          <div ref={chatEndRef} className="h-2" />
        </div>

        <div className="p-4 max-w-4xl mx-auto w-full bg-gradient-to-t from-black to-transparent">
          <form onSubmit={handleSendMessage} className="relative">
            <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)}
              placeholder={isOnline ? `Message ${currentAgent === 'devAgent' ? 'Dev Agent' : 'K.A Mentor'}...` : "Offline: 'remember: [text]' ya 'memory'"}
              className="w-full bg-[#151515] border border-white/10 rounded-xl py-4 pl-5 pr-14 text-sm text-white focus:outline-none focus:border-cyan-500/50 placeholder:text-gray-600" />
            <button type="submit" disabled={isTyping || !chatInput.trim()}
              className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-lg text-cyan-400 bg-cyan-500/10 hover:bg-cyan-500/20 disabled:opacity-30">
              <Send size={18} />
            </button>
          </form>
          <div className="text-center text-[10px] text-gray-600 mt-3">
            K.A Core AI System • {isOnline ? 'Multi-Provider Router Active' : 'Operating Offline'}
          </div>
        </div>
      </div>

      {showAdminPanel && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
          <div className="bg-[#0a0a0a] border border-white/10 p-6 rounded-2xl w-full max-w-md relative">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-cyan-500"></div>
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-lg font-bold flex items-center gap-2"><Shield className="text-cyan-500"/> System Terminal</h2>
              <button onClick={() => setShowAdminPanel(false)} className="text-gray-500 hover:text-white bg-white/5 p-1.5 rounded-lg"><X size={18}/></button>
            </div>
            {!isAdminAuth ? (
              <form onSubmit={handleAdminLogin} className="space-y-4">
                <p className="text-sm text-gray-400 bg-white/5 p-3 rounded">Restricted. Verify identity.</p>
                <div className="relative">
                  <Lock size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" />
                  <input type="password" value={adminPin} onChange={(e) => setAdminPin(e.target.value)}
                    placeholder="PIN (0001@)" className="w-full bg-[#111] border border-white/10 rounded-lg py-3 pl-10 pr-4 text-white focus:border-cyan-500 outline-none" />
                </div>
                <button type="submit" className="w-full bg-cyan-900/50 border border-cyan-800 text-cyan-400 rounded-lg p-3 font-bold">Authorize</button>
              </form>
            ) : (
              <div className="space-y-6 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
                <div className="p-3 bg-green-900/20 border border-green-500/30 rounded-lg text-green-400 text-xs font-mono flex items-center gap-2">
                  <CheckCircle size={14}/> ROOT ACCESS GRANTED
                </div>

                <div className="p-4 bg-white/5 border border-white/10 rounded-lg">
                  <h3 className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider flex items-center gap-2">
                    <Lock size={14}/> API Keys (device par save)
                  </h3>
                  <div className="space-y-2">
                    {[
                      { k: 'VITE_GEMINI_API_KEY', l: 'Gemini API Key (required)' },
                      { k: 'VITE_GROQ_API_KEY', l: 'Groq API Key (optional)' },
                      { k: 'VITE_OPENROUTER_API_KEY', l: 'OpenRouter API Key (optional)' }
                    ].map(({k, l}) => (
                      <div key={k}>
                        <label className="text-[10px] text-gray-500 block mb-1">{l}</label>
                        <input type="password" defaultValue={localStorage.getItem(k) || ''}
                          onBlur={(e) => { const v = e.target.value.trim(); if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); runDiagnostics(); }}
                          placeholder="Paste key..." className="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs text-gray-300 focus:border-cyan-500/50 outline-none" />
                      </div>
                    ))}
                  </div>
                  <p className="text-[10px] text-amber-400 mt-2">⚠️ Key paste karne ke baad app reload karo.</p>
                </div>

                <div className="p-4 bg-white/5 border border-white/10 rounded-lg">
                  <h3 className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider flex items-center gap-2">
                    <BrainCircuit size={14}/> Agent Override
                  </h3>
                  <div className="flex gap-2">
                    <button onClick={() => { const s = sessions.find(x=>x.agent==='mentor'); s ? switchSession(s.id) : createNewSession('mentor'); setShowAdminPanel(false); }}
                      className={`flex-1 py-2.5 px-2 text-xs font-semibold rounded-md ${currentAgent === 'mentor' ? 'bg-cyan-900/40 text-cyan-400 border border-cyan-800' : 'bg-black border border-white/5 text-gray-400'}`}>K.A Mentor</button>
                    <button onClick={() => { const s = sessions.find(x=>x.agent==='devAgent'); s ? switchSession(s.id) : createNewSession('devAgent'); setShowAdminPanel(false); }}
                      className={`flex-1 py-2.5 px-2 text-xs font-semibold rounded-md ${currentAgent === 'devAgent' ? 'bg-purple-900/40 text-purple-400 border border-purple-800' : 'bg-black border border-white/5 text-gray-400'}`}>Dev Agent</button>
                  </div>
                </div>

                <div className="p-4 bg-white/5 border border-white/10 rounded-lg">
                  <h3 className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider flex items-center gap-2">
                    <Server size={14}/> Router Cascade Status
                  </h3>
                  <div className="space-y-2">
                    {Object.entries(diagnostics).map(([provider, status]) => (
                      <div key={provider} className="flex justify-between items-center bg-black/40 p-2 rounded border border-white/5">
                        <span className="text-xs text-gray-300 capitalize">{provider}</span>
                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] px-2 py-0.5 rounded font-mono ${
                            status.includes('Verified') || status === 'Connected' ? 'bg-green-900/30 text-green-400'
                            : status.includes('Failed') ? 'bg-red-900/30 text-red-400'
                            : 'bg-amber-900/30 text-amber-400'}`}>{status}</span>
                          {status === 'Requires Verification' && provider !== 'firebase' && (
                            <button onClick={() => handleVerifyProvider(provider)} disabled={isTesting === provider}
                              className="text-[10px] bg-cyan-900/50 text-cyan-400 px-2 py-0.5 rounded">
                              {isTesting === provider ? '...' : 'Test'}
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <button onClick={() => setIsAdminAuth(false)} className="w-full flex justify-center items-center gap-2 bg-transparent hover:bg-white/5 rounded-lg p-3 text-gray-500 text-xs">
                  <LogOut size={14}/> Lock Session
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {showProfilePanel && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex flex-col justify-end sm:items-center sm:justify-center p-0 sm:p-4">
          <div className="bg-[#111] border-t sm:border border-white/10 p-6 rounded-t-3xl sm:rounded-2xl w-full max-w-sm">
            <div className="flex justify-between items-start mb-4">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-full bg-cyan-900/30 flex items-center justify-center border border-cyan-500/50">
                  <User size={24} className="text-cyan-400" />
                </div>
                <div>
                  <h2 className="text-lg font-bold text-white">Local User</h2>
                  <p className="text-xs text-gray-500 font-mono">Offline / Local DB</p>
                </div>
              </div>
              <button onClick={() => setShowProfilePanel(false)} className="text-gray-500 hover:text-white bg-white/5 p-2 rounded-full"><X size={16}/></button>
            </div>
            <div className="space-y-4 mb-6">
              <div className="bg-white/5 p-3 rounded-xl border border-white/5">
                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                  <BrainCircuit size={14}/> Personal Instructions
                </label>
                <textarea value={customInstructions} onChange={(e) => setCustomInstructions(e.target.value)}
                  placeholder="How should K.A Mentor respond?"
                  className="w-full h-24 bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-sm text-gray-300 focus:border-cyan-500/50 resize-none custom-scrollbar outline-none" />
                <button onClick={async () => {
                  setIsSavingSettings(true);
                  await saveSetting('customInstructions', customInstructions);
                  setTimeout(() => setIsSavingSettings(false), 800);
                }} className="w-full mt-2 py-2 bg-cyan-900/30 hover:bg-cyan-900/50 text-cyan-400 border border-cyan-800 text-xs font-semibold rounded-lg flex items-center justify-center gap-2">
                  {isSavingSettings ? <Activity size={14} className="animate-spin" /> : <Save size={14} />}
                  {isSavingSettings ? "Saving..." : "Save Instructions"}
                </button>
              </div>
              <div className="p-3 bg-white/5 rounded-xl border border-white/5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <HardDrive size={16} className="text-gray-400" />
                  <span className="text-sm text-gray-300">Local Memory Bank</span>
                </div>
                <span className="text-xs bg-cyan-900/30 text-cyan-400 px-2 py-1 rounded">Active</span>
              </div>
            </div>
            <button onClick={() => setShowProfilePanel(false)} className="w-full py-3 bg-white/10 hover:bg-white/15 text-white text-sm font-semibold rounded-xl">Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  return <ErrorBoundary><KASourceControlApp /></ErrorBoundary>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
